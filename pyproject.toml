[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latexfigure"
version = "1.5.0"
description = "Publication-quality Matplotlib figures sized to match your LaTeX document."
readme = "Readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.6",
    # Used by show() / savefig_show() to rasterize the exported PDF for an
    # inline preview. Self-contained wheel; display happens via IPython
    # (imported lazily, present in any notebook).
    "PyMuPDF",
]

[tool.setuptools]
py-modules = ["latexfigure"]
